<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Acesso</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
        }

        .login {
            width: 320px;
            padding: 30px;
            background: #1f2937;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        label {
            color: #d1d5db;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 18px;
            border: none;
            border-radius: 6px;
            background: #374151;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #mensagem {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>🔐 Sistema de Acesso</h1>

        <form id="loginForm">

            <label>E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                ENTRAR
            </button>

        </form>

        <div id="mensagem"></div>

    </div>

    <script>

        const form = document.getElementById("loginForm");
        const mensagem = document.getElementById("mensagem");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            if (
                email === "aluna@laboratorio.local" &&
                senha === "python123"
            ) {

                mensagem.style.color = "#22c55e";
                mensagem.textContent = "Acesso concedido!";

            } else {

                mensagem.style.color = "#ef4444";
                mensagem.textContent = "E-mail ou senha incorretos.";

            }

        });

    </script>

</body>

</html>
